name: E2E Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokerpoints
          POSTGRES_PASSWORD: pokerpoints
          POSTGRES_DB: pokerpoints_e2e
        options: >-
          --health-cmd "pg_isready -U pokerpoints -d pokerpoints_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            src/frontend/poker-points-app/package-lock.json
            tests/e2e/package-lock.json
      - name: Build backend
        working-directory: src/backend/PokerPoints
        run: dotnet build --configuration Release
      # Application startup applies migrations; no uninstalled global dotnet-ef tool is needed.
      - name: Start backend
        working-directory: src/backend/PokerPoints
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5051
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=pokerpoints_e2e;Username=pokerpoints;Password=pokerpoints
        run: |
          dotnet run --project PokerPoints.Api --no-build --no-launch-profile --configuration Release > "$RUNNER_TEMP/e2e-backend.log" 2>&1 &
          timeout 60 bash -c 'until curl --fail --silent http://localhost:5051/health; do sleep 1; done'
      - name: Install frontend
        working-directory: src/frontend/poker-points-app
        run: npm ci
      - name: Install browser tests
        working-directory: tests/e2e
        run: npm ci
      - name: Check browser test dependencies
        working-directory: tests/e2e
        run: npm audit --audit-level=high
      - name: Install browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_START_SERVER: 'true'
        run: npm test
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-results
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            ${{ runner.temp }}/e2e-backend.log
          retention-days: 7
