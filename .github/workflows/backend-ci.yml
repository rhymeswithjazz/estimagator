name: Backend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend/PokerPoints
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes
      - name: Build
        run: dotnet build --no-restore --configuration Release
      # Integration tests create isolated PostgreSQL databases through Testcontainers.
      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage"
      - name: Scan dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive --format json > vulnerability-report.json
          python3 - <<'PYTHON'
          import json, sys
          report = json.load(open('vulnerability-report.json'))
          findings = [
              (project['path'], package['id'], issue['severity'], issue['advisoryurl'])
              for project in report.get('projects', [])
              for framework in project.get('frameworks', [])
              for group in ('topLevelPackages', 'transitivePackages')
              for package in framework.get(group, [])
              for issue in package.get('vulnerabilities', [])
              if issue['severity'].lower() in ('high', 'critical')
          ]
          for finding in findings:
              print(' | '.join(finding))
          sys.exit(bool(findings))
          PYTHON
      - name: Upload test and security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-reports
          path: |
            src/backend/PokerPoints/**/TestResults/
            src/backend/PokerPoints/vulnerability-report.json
          retention-days: 7
