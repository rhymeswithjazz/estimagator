name: Docker Build & Push

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

env:
  DOCKER_USERNAME: rhymeswithjazz
  API_IMAGE: rhymeswithjazz/estimagator-api
  FRONTEND_IMAGE: rhymeswithjazz/estimagator-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: estimagator-image-publication
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - name: Generate CalVer tag
        id: calver
        run: |
          CALVER=$(date +'%Y.%m.%d')
          echo "tag=${CALVER}" >> "$GITHUB_OUTPUT"
          echo "📅 CalVer tag: ${CALVER}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.calver.outputs.tag }}
            type=sha,prefix={{branch}}-
            type=sha,prefix=sha-,format=long

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.calver.outputs.tag }}
            type=sha,prefix={{branch}}-
            type=sha,prefix=sha-,format=long

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: src/backend/PokerPoints
          file: src/backend/PokerPoints/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=registry,ref=${{ env.API_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.API_IMAGE }}:buildcache,mode=max

      - name: Build and push Frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: src/frontend/poker-points-app
          file: src/frontend/poker-points-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

      - name: Manual deployment summary
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          {
            echo '### Images ready for manual Portainer deployment'
            echo "Commit: ${GITHUB_SHA}"
            echo "API: ${API_IMAGE}@${API_DIGEST}"
            echo "Frontend: ${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"
            echo "Both images also have the tag sha-${GITHUB_SHA}."
            echo 'Update both services together in Portainer using these digests or the matching commit tag.'
            echo 'GitHub has published images; it has not deployed or health-checked the application.'
          } >> "$GITHUB_STEP_SUMMARY"
