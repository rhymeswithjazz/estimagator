name: Docker Build & Push

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

env:
  DOCKER_USERNAME: rhymeswithjazz

jobs:
  build-and-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            image: rhymeswithjazz/estimagator-api
            context: src/backend/PokerPoints
          - name: Frontend
            image: rhymeswithjazz/estimagator-frontend
            context: src/frontend/poker-points-app
    concurrency:
      group: estimagator-image-publication-${{ matrix.name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - name: Generate CalVer tag
        id: calver
        run: |
          CALVER=$(date +'%Y.%m.%d')
          echo "tag=${CALVER}" >> "$GITHUB_OUTPUT"
          echo "📅 CalVer tag: ${CALVER}"

      # Only the small runtime stages run emulated; the build stages cross-compile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.calver.outputs.tag }}
            type=sha,prefix={{branch}}-
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache,mode=max

      - name: Published image summary
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.name }} image published"
            echo "Commit: ${GITHUB_SHA}"
            echo "Image: ${IMAGE}@${DIGEST}"
            echo "Also tagged sha-${GITHUB_SHA}."
            echo 'Watchtower on the droplet pulls the new `latest` tag on its next check and restarts the container.'
            echo 'GitHub has published the image; it has not deployed or health-checked the application.'
          } >> "$GITHUB_STEP_SUMMARY"
