name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend/poker-points-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: src/frontend/poker-points-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Scan dependencies
        run: npm audit --audit-level=high
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: src/frontend/poker-points-app/coverage/
          retention-days: 7
      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: src/frontend/poker-points-app/dist/
          retention-days: 7
